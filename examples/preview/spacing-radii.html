<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">

      <div style="font:600 12px/1.1 var(--font-family);color:#001928">None</div>
      <div style="font:400 11px/1.2 var(--font-family-mono);color:#646C76">0</div>
      <div style="font:400 11px/1.2 var(--font-family);color:#646C76">nav bars</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px">

      <div style="font:400 11px/1.2 var(--font-family-mono);color:#646C76">2px</div>
      <div style="font:400 11px/1.2 var(--font-family);color:#646C76">badges</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px">

      <div style="font:400 11px/1.2 var(--font-family);color:#646C76">DEFAULT</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px">
      <div style="width:60px;height:60px;background:#FFFFFF;border:1px solid #D9DCE1;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.06)"></div>
      <div style="font:600 12px/1.1 var(--font-family);color:#001928">Large</div>
      <div style="font:400 11px/1.2 var(--font-family-mono);color:#646C76">8px</div>
      <div style="font:400 11px/1.2 var(--font-family);color:#646C76">large cards</div>
    </div>

      <div style="font:600 12px/1.1 var(--font-family);color:#001928">X-Large</div>
      <div style="font:400 11px/1.2 var(--font-family-mono);color:#646C76">12px</div>
      <div style="font:400 11px/1.2 var(--font-family);color:#646C76">popovers</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-width:74px">
      <div style="width:60px;height:60px;background:#FFFFFF;border:1px solid #D9DCE1;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.06)"></div>
      <div style="font:600 12px/1.1 var(--font-family);color:#001928">Circle</div>
      <div style="font:400 11px/1.2 var(--font-family-mono);color:#646C76">50%</div>
