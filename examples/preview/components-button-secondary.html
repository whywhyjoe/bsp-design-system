<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:14px">Secondary + tertiary buttons</div>
<div style="display:flex;flex-direction:column;gap:12px">

    <button class="btn btn--secondary">Save draft</button>

  </div>
