<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:10px">Feedback · status</div>
<div class="row" style="gap:10px">
  <div class="sw"><span class="chip" style="background:#0F9B2C"></span>
    <div class="meta">Positive<div class="hex">#0F9B2C · --fg-success</div></div></div>
  <div class="sw"><span class="chip" style="background:#D12121"></span>
    <div class="meta">Negative<div class="hex">#D12121 · --fg-danger</div></div></div>
  <div class="sw" style="border-color:#ED1C24">
    <span class="chip" style="background:#ED1C24;position:relative">
      <span style="position:absolute;inset:auto 6px 4px auto;font:600 9px/1 var(--font-family);color:#fff;letter-spacing:.05em">LOGO ONLY</span>
    </span>
    <div class="meta">BMO Red<div class="hex">#ED1C24 · roundel + lockup only</div></div></div>
  <div class="sw"><span class="chip" style="background:#F2C811"></span>
    <div class="meta">Yellow<div class="hex">#F2C811 · Fluent 2 caution</div></div></div>
</div>
<div class="callout"><strong>Rule:</strong> errors use Negative (#D12121), not BMO Red (#ED1C24). The two reds must never appear in the same view.</div>
</div></body></html>
