<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:14px">Message bars · semantic feedback</div>
<div style="display:flex;flex-direction:column;gap:10px">
  <div class="msgbar msgbar--info" role="status">
    <svg class="icon icon--20 msgbar__icon"><use href="../../bmo-icons.svg#ic-fluent-info-24-regular"/></svg>
    <div class="msgbar__body">New approval policy takes effect Monday. <a href="#">Read the change summary</a>.</div>
  </div>
  <div class="msgbar msgbar--success" role="status">
    <svg class="icon icon--20 msgbar__icon"><use href="../../bmo-icons.svg#ic-fluent-checkmark-circle-24-regular"/></svg>
    <div class="msgbar__body"><strong>Request submitted.</strong> Approval is pending with Sarah Chen.</div>
  </div>
  <div class="msgbar msgbar--warning" role="status">
    <svg class="icon icon--20 msgbar__icon"><use href="../../bmo-icons.svg#ic-fluent-warning-24-regular"/></svg>
    <div class="msgbar__body">Cost centre missing on 2 line items. Add before submission.</div>
  </div>
  <div class="msgbar msgbar--danger" role="status">
    <svg class="icon icon--20 msgbar__icon"><use href="../../bmo-icons.svg#ic-fluent-warning-24-regular"/></svg>
    <div class="msgbar__body"><strong>We couldn't save your changes.</strong> Try again.</div>
  </div>
</div>
</div></body></html>
