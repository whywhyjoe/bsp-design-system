<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:14px">Text input · states</div>
<div style="display:flex;flex-direction:column;gap:10px;max-width:360px">
  <div class="field">
    <label class="field__label">Label</label>
    <input class="input" placeholder="Placeholder text">
    <p class="field__hint">rest</p>
  </div>
  <div class="field">
    <input class="input demo-focus" value="With keyboard focus">
    <p class="field__hint">focus · 1px --stroke-accent + ring</p>
  </div>
  <div class="field">
    <input class="input" aria-invalid="true" value="invalid@">
    <p class="field__error">Enter a valid email address.</p>
  </div>
  <div class="field">
    <input class="input" value="Read-only value" disabled>
    <p class="field__hint">disabled · [disabled] attribute</p>
  </div>
</div>
</div></body></html>
