<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:14px">Badges + tags + status dots</div>
<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
  <span class="badge badge--info">Pending</span>
  <span class="badge badge--success">Approved</span>
  <span class="badge badge--danger">Returned</span>
  <span class="badge">Draft</span>
  <span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-body1);color:var(--fg-primary)"><span class="dot dot--success"></span>Available</span>
  <span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-body1);color:var(--fg-primary)"><span class="dot dot--warning"></span>Away</span>
  <span style="display:inline-flex;align-items:center;gap:6px;font:var(--type-body1);color:var(--fg-primary)"><span class="dot dot--danger"></span>Busy</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">
  <span class="tag">Finance <button class="tag__remove" aria-label="Remove Finance"><svg class="icon"><use href="../../fluent-basic-icons.svg#ic-fluent-dismiss-24-regular"/></svg></button></span>
  <span class="tag">Toronto <button class="tag__remove" aria-label="Remove Toronto"><svg class="icon"><use href="../../fluent-basic-icons.svg#ic-fluent-dismiss-24-regular"/></svg></button></span>
  <span class="tag is-active">Q3 <svg class="icon icon--12"><use href="../../fluent-basic-icons.svg#ic-fluent-checkmark-24-regular"/></svg></span>
</div>
</div></body></html>
