<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:14px">Primary button · states</div>
<div style="display:flex;flex-direction:column;gap:12px">
  <div class="row" style="align-items:center;gap:14px">
    <button class="btn btn--primary">Submit request</button>
    <span class="token">rest · --accent-rest</span>
  </div>
  <div class="row" style="align-items:center;gap:14px">
    <button class="btn btn--primary demo-hover">Submit request</button>
    <span class="token">hover · --accent-hover</span>
  </div>
  <div class="row" style="align-items:center;gap:14px">
    <button class="btn btn--primary demo-focus">Submit request</button>
    <span class="token">focus-visible · 2px --stroke-focus</span>
  </div>
  <div class="row" style="align-items:center;gap:14px">
    <button class="btn btn--primary" disabled>Submit request</button>
    <span class="token">disabled · [disabled] attribute</span>
  </div>
</div>
</div></body></html>
