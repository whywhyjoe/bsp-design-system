<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="preview">
<div class="label" style="margin-bottom:14px">Icon color · by role (currentColor)</div>
<div style="display:flex;gap:24px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <svg class="icon icon--20" style="color:var(--fg-primary)"><use href="../../fluent-basic-icons.svg#ic-fluent-home-24-regular"/></svg>
    <div style="font:var(--type-caption1-strong);color:var(--fg-primary)">Slate</div>
    <div class="token">default UI</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <svg class="icon icon--20" style="color:var(--fg-accent)"><use href="../../fluent-basic-icons.svg#ic-fluent-home-24-regular"/></svg>
    <div style="font:var(--type-caption1-strong);color:var(--fg-accent)">Accessible Blue</div>
    <div class="token">interactive</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <svg class="icon icon--20" style="color:var(--fg-secondary)"><use href="../../fluent-basic-icons.svg#ic-fluent-home-24-regular"/></svg>
    <div style="font:var(--type-caption1-strong);color:var(--fg-secondary)">Granite</div>
    <div class="token">de-emphasized</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <svg class="icon icon--20" style="color:var(--fg-success)"><use href="../../fluent-basic-icons.svg#ic-fluent-home-24-regular"/></svg>
    <div style="font:var(--type-caption1-strong);color:var(--fg-success)">Positive</div>
    <div class="token">success</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <svg class="icon icon--20" style="color:var(--fg-danger)"><use href="../../fluent-basic-icons.svg#ic-fluent-home-24-regular"/></svg>
    <div style="font:var(--type-caption1-strong);color:var(--fg-danger)">Negative</div>
    <div class="token">error</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bmo-slate);padding:10px;border-radius:var(--radius-medium);color:var(--bmo-white)">
    <svg class="icon icon--20" style="color:var(--bmo-white)"><use href="../../fluent-basic-icons.svg#ic-fluent-home-24-regular"/></svg>
    <div style="font:var(--type-caption1-strong);color:var(--bmo-white)">White</div>
    <div class="token" style="color:var(--f2-grey-58)">on dark surfaces</div>
  </div>
</div>
<div class="callout">One solid color only — never gradient, shadow, or multi-tone on a Fluent icon. Color comes from <code class="token">currentColor</code>, set via the parent's <code class="token">color</code>.</div>
</div></body></html>
